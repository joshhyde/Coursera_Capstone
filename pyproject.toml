[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron"
version = "0.1.0"
description = "Rank +EV Hard Rock Bet NFL and NCAAF mainlines from OddsPapi"
readme = "gridiron/README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gridiron = "gridiron.cli:main"

[tool.setuptools.packages.find]
include = ["gridiron"]
exclude = ["gridiron.tests*"]

[tool.pytest.ini_options]
testpaths = ["gridiron/tests"]
pythonpath = ["."]
addopts = "-q"
